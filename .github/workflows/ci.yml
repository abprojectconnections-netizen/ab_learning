name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Throw-away MySQL for this job only. Root has no password and the port is
      # reachable only from the runner, so no credentials exist to leak.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: ab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      SEED_DEV: "true"
      DB_DSN: root:@tcp(127.0.0.1:3306)/ab_test?parseTime=true&charset=utf8mb4&loc=UTC
      CORS_ALLOW_ORIGIN: http://localhost:3000
      PORT: "8080"
      UPLOAD_DIR: ./uploads-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - name: Unit tests with coverage
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: Boot API on real MySQL and run smoke test
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          go build -o bin/api ./cmd/api
          ./bin/api > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          sh scripts/smoke.sh
      - name: Restart API (migrations must be idempotent)
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          kill "$(cat api.pid)"; sleep 1
          ./bin/api > api2.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          sh scripts/smoke.sh
          grep -q "migration already applied" api2.log
      - name: Verify migration 003 on a fresh database
        env:
          MYSQL_DATABASE: ab_test
        run: sh scripts/verify-migrations.sh
      - name: Upgrade path (existing 001+002 database gets 003 without data loss)
        env:
          MYSQL_DATABASE: ab_upgrade
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE ab_upgrade CHARACTER SET utf8mb4"
          mysql -h 127.0.0.1 -uroot ab_upgrade < db/migrations/001_init.sql
          mysql -h 127.0.0.1 -uroot ab_upgrade < db/migrations/002_reference_data.sql
          mysql -h 127.0.0.1 -uroot ab_upgrade -e "INSERT INTO users (role_id,email,password_hash) SELECT id,'keep-me@example.test','x' FROM roles WHERE code='LEARNER'"
          export JWT_SECRET="$(openssl rand -hex 32)"
          DB_DSN="root:@tcp(127.0.0.1:3306)/ab_upgrade?parseTime=true&charset=utf8mb4&loc=UTC" \
            PORT=8081 SEED_DEV=false ./bin/api > api-upgrade.log 2>&1 &
          echo $! > api-upgrade.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          kill "$(cat api-upgrade.pid)"
          grep -q "baseline recorded" api-upgrade.log
          sh scripts/verify-migrations.sh
          test "$(mysql -h 127.0.0.1 -uroot -N ab_upgrade -e "SELECT COUNT(*) FROM users WHERE email='keep-me@example.test'")" = "1"
      - name: Backup and restore round trip
        run: |
          export MYSQL_HOST=127.0.0.1 MYSQL_USER=root
          BACKUP_DIR=backups-ci MYSQL_DATABASE=ab_test sh scripts/db-backup.sh | tee backup.path
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE ab_restore CHARACTER SET utf8mb4"
          RESTORE_CONFIRM=yes MYSQL_DATABASE=ab_restore sh scripts/db-restore.sh "$(tail -1 backup.path)"
          for t in users roles menu_items permissions schema_migrations; do
            a=$(mysql -h 127.0.0.1 -uroot -N ab_test -e "SELECT COUNT(*) FROM $t")
            b=$(mysql -h 127.0.0.1 -uroot -N ab_restore -e "SELECT COUNT(*) FROM $t")
            [ "$a" = "$b" ] || { echo "row count mismatch in $t: $a vs $b" >&2; exit 1; }
          done
          # A second restore into the now non-empty database must refuse.
          if RESTORE_CONFIRM=yes MYSQL_DATABASE=ab_restore sh scripts/db-restore.sh "$(tail -1 backup.path)"; then
            echo "restore overwrote a non-empty database" >&2; exit 1
          fi
      - name: Demo seed (20-30 rows per module) is complete and idempotent
        run: |
          go build -o bin/seed ./cmd/seed
          ./bin/seed | tee seed1.log
          grep -q "demo data loaded" seed1.log
          MYSQL_DATABASE=ab_test sh scripts/verify-seed.sh
          ./bin/seed | tee seed2.log
          grep -q "already present" seed2.log
          # Demo accounts can sign in (the API's own password hashing).
          export JWT_SECRET="$(openssl rand -hex 32)"
          PORT=8082 ./bin/api > api-demo.log 2>&1 &
          echo $! > api-demo.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8082/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8082/api/v1 SMOKE_IDENTIFIER=demo.learner01@example.test sh scripts/smoke.sh
          kill "$(cat api-demo.pid)"
      - name: Session security flow (rotation, reuse detection, logout, reset, change password)
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          RATE_LIMIT_REQUESTS=1000 PORT=8083 ./bin/api > api-auth.log 2>&1 &
          echo $! > api-auth.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8083/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8083/api/v1 API_LOG=api-auth.log sh scripts/auth-flow.sh
          kill "$(cat api-auth.pid)"
      - name: Notifications, orders, reviews and audit-log API flow (demo data)
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          RATE_LIMIT_REQUESTS=2000 PORT=8084 ./bin/api > api-flow.log 2>&1 &
          echo $! > api-flow.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8084/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          cid() { mysql -h 127.0.0.1 -uroot -N ab_test -e "SELECT id FROM courses WHERE slug='demo-course-$1'"; }
          BASE_URL=http://127.0.0.1:8084/api/v1 COURSE_A="$(cid 01)" COURSE_B="$(cid 02)" COURSE_X="$(cid 10)" \
            sh scripts/api-flow.sh
          kill "$(cat api-flow.pid)"
      - name: Sandbox payment flow (checkout, idempotency, webhook signature, refund)
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export PAYMENT_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          PAYMENT_MODE=sandbox RATE_LIMIT_REQUESTS=2000 PORT=8085 ./bin/api > api-pay.log 2>&1 &
          echo $! > api-pay.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8085/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          grep -q "payments: SANDBOX mode" api-pay.log
          paid() { mysql -h 127.0.0.1 -uroot -N ab_test -e "SELECT id FROM courses WHERE status='published' AND COALESCE(discount_price,price)>0 ORDER BY id LIMIT 1 OFFSET $1"; }
          BASE_URL=http://127.0.0.1:8085/api/v1 COURSE_A="$(paid 0)" COURSE_B="$(paid 1)" sh scripts/payment-flow.sh
          kill "$(cat api-pay.pid)"
          # Live mode must make the API refuse to start.
          if PAYMENT_MODE=live PORT=8086 ./bin/api > api-live.log 2>&1; then
            echo "API started with PAYMENT_MODE=live" >&2; exit 1
          fi
      - name: Seed refuses staging and remote hosts
        run: |
          if APP_ENV=staging JWT_SECRET="$(openssl rand -hex 32)" CORS_ALLOW_ORIGIN=https://example.test ./bin/seed; then
            echo "seed ran in staging" >&2; exit 1
          fi
          if DB_DSN="root:@tcp(db.example.test:3306)/x" ./bin/seed; then
            echo "seed ran against a remote host" >&2; exit 1
          fi
      - name: Docker image builds (API + seed binaries)
        working-directory: backend
        run: docker build -t ab-api:ci .
      - name: API logs on failure
        if: failure()
        run: tail -n 80 api.log api2.log api-auth.log api-flow.log api-pay.log 2>/dev/null || true
      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm run lint --prefix functions
      - run: npm ci --prefix rules-tests
      # Allow/deny matrix for every collection, run against the local emulator.
      - run: >
          npx --yes firebase-tools@latest emulators:exec --only firestore,storage
          --project demo-ab-learning "npm test --prefix rules-tests"
