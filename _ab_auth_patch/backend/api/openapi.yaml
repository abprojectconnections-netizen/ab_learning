openapi: 3.0.3
info:
  title: AB LEARNING API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Access/refresh tokens and user
        '401':
          description: Invalid credentials
        '403':
          description: Account inactive
  /api/v1/auth/register:
    post:
      summary: Register a learner or instructor and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 8 }
                role:
                  type: string
                  enum: [LEARNER, INSTRUCTOR]
                  default: LEARNER
      responses:
        '201':
          description: Account created with access/refresh tokens
        '409':
          description: Email or phone already registered
        '422':
          description: Validation failed
  /api/v1/auth/refresh:
    post:
      summary: Exchange refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: New token pair }
        '401': { description: Invalid refresh token }
  /api/v1/me:
    get:
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Missing or invalid access token }
    put:
      summary: Update current user profile name
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated user }
  /api/v1/admin/instructors/pending:
    get:
      summary: List active instructors awaiting approval
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pending instructor accounts }
        '403': { description: Admin role required }
  /api/v1/admin/instructors/{id}/approve:
    post:
      summary: Approve an instructor
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Instructor verified }
        '404': { description: Instructor not found }
        '409': { description: Instructor already verified }
        '403': { description: Admin role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
